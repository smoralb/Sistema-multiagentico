<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podio - Uso Pencil?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Confetti background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle, #FFD700 2px, transparent 2px),
                radial-gradient(circle, #DC0000 2px, transparent 2px),
                radial-gradient(circle, #00cc66 2px, transparent 2px);
            background-size: 50px 50px, 80px 80px, 60px 60px;
            background-position: 0 0, 20px 20px, 40px 40px;
            opacity: 0.3;
            animation: confettiFall 10s linear infinite;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100px); }
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .trophy-container {
            position: relative;
            margin-bottom: 40px;
            animation: trophyRise 2s ease-out;
        }

        @keyframes trophyRise {
            from {
                opacity: 0;
                transform: translateY(100px) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .trophy {
            font-size: 150px;
            filter: drop-shadow(0 0 30px #FFD700);
            animation: trophyFloat 3s ease-in-out infinite;
        }

        @keyframes trophyFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .trophy-shine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 215, 0, 0.5),
                transparent
            );
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        h1 {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            animation: goldShimmer 3s ease-in-out infinite;
            transform: skewY(-2deg);
        }

        @keyframes goldShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 28px;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 50px;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .podium {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 50px;
            animation: fadeInUp 2s ease-out;
        }

        .podium-position {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: riseUp 1.5s ease-out backwards;
        }

        .podium-position:nth-child(1) { animation-delay: 0.5s; }
        .podium-position:nth-child(2) { animation-delay: 0s; }
        .podium-position:nth-child(3) { animation-delay: 1s; }

        @keyframes riseUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .podium-number {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .podium-box {
            width: 120px;
            text-align: center;
            padding: 20px;
            border-radius: 10px 10px 0 0;
            font-size: 36px;
            font-weight: 900;
            color: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .podium-position:nth-child(1) .podium-box {
            height: 120px;
            background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%);
        }

        .podium-position:nth-child(2) .podium-box {
            height: 180px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: 5px solid #fff;
        }

        .podium-position:nth-child(3) .podium-box {
            height: 100px;
            background: linear-gradient(135deg, #CD7F32 0%, #8B5A00 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .victory-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 50px;
            animation: fadeIn 2.5s ease-out;
        }

        .stat-display {
            background: rgba(255, 215, 0, 0.1);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 25px 35px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-display:hover {
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }

        .stat-display .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .stat-display .label {
            font-size: 14px;
            color: #FFD700;
            margin-bottom: 8px;
        }

        .stat-display .value {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .back-button {
            display: inline-block;
            padding: 20px 60px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            text-decoration: none;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 3px solid #fff;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
            animation: victoryPulse 3s ease-out;
        }

        .back-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.8);
        }

        @keyframes victoryPulse {
            from {
                opacity: 0;
                transform: scale(0);
            }
            60% {
                opacity: 1;
                transform: scale(1.2);
            }
            to {
                transform: scale(1);
            }
        }

        /* Sparkles effect */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 15px #FFD700;
            animation: sparkleMove 4s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 25%; right: 12%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { top: 60%; left: 8%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 20%; right: 15%; animation-delay: 1.5s; }
        .sparkle:nth-child(5) { bottom: 40%; left: 18%; animation-delay: 2s; }

        @keyframes sparkleMove {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            25% {
                transform: translate(20px, -20px) scale(1.5);
                opacity: 0.7;
            }
            50% {
                transform: translate(0, -40px) scale(0.8);
                opacity: 1;
            }
            75% {
                transform: translate(-20px, -20px) scale(1.2);
                opacity: 0.5;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
                letter-spacing: 4px;
            }

            .trophy {
                font-size: 100px;
            }

            .podium {
                gap: 10px;
            }

            .podium-box {
                width: 80px;
                font-size: 24px;
            }

            .podium-position:nth-child(1) .podium-box { height: 80px; }
            .podium-position:nth-child(2) .podium-box { height: 120px; }
            .podium-position:nth-child(3) .podium-box { height: 60px; }

            .victory-stats {
                flex-direction: column;
                gap: 20px;
            }

            .back-button {
                font-size: 18px;
                padding: 15px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="container">
        <div class="trophy-container">
            <div class="trophy-shine"></div>
            <div class="trophy">🏆</div>
        </div>

        <h1>Uso Pencil?</h1>
        <p class="subtitle">🏆 ¡VICTORIA! 🏆</p>

        <div class="podium">
            <div class="podium-position">
                <div class="podium-number">🥈</div>
                <div class="podium-box">2</div>
            </div>
            <div class="podium-position">
                <div class="podium-number">🥇</div>
                <div class="podium-box">1</div>
            </div>
            <div class="podium-position">
                <div class="podium-number">🥉</div>
                <div class="podium-box">3</div>
            </div>
        </div>

        <div class="victory-stats">
            <div class="stat-display">
                <div class="icon">🏁</div>
                <div class="label">CARRERAS GANADAS</div>
                <div class="value">42</div>
            </div>
            <div class="stat-display">
                <div class="icon">⭐</div>
                <div class="label">PUNTOS TOTALES</div>
                <div class="value">9999</div>
            </div>
            <div class="stat-display">
                <div class="icon">👑</div>
                <div class="label">CAMPEONATOS</div>
                <div class="value">7</div>
            </div>
        </div>

        <a href="index.html" class="back-button">← Volver al Menú</a>
    </div>
</body>
</html>
